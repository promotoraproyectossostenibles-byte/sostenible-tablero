name: Refrescar data.json desde ClickUp

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar data.json
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
        run: python3 generate.py

      - name: Commit si hubo cambios
        run: |
          git config user.name "sostenible-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "Auto: refrescar data.json desde ClickUp"
            git push
          else
            echo "Sin cambios en data.json"
          fi
